<!doctype html>
<html lang="ja">
  <head>
    <script>
      // テーマ適用
      const savedTheme = localStorage.getItem("theme");
      if (
        savedTheme === "dark" ||
        (!savedTheme &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }

      // 言語リダイレクト処理（初回は英語版を表示）
      const savedLang = localStorage.getItem("user_lang");
      if (!savedLang) {
        localStorage.setItem("user_lang", "en");
        window.location.replace("/index-en.html");
      } else if (savedLang === "en") {
        window.location.replace("/index-en.html");
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="/css/destyle-customize.css"
      rel="stylesheet"
      type="text/css"
      media="all"
    />
    <link href="/css/style.css" rel="stylesheet" type="text/css" media="all" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>NuroHive</title>
  </head>
  <body>
    <div id="page-loader"></div>
    <header id="header">
      <div id="header-icon-and-logo-container">
        <img id="header-icon" src="/images/main-logo.png" alt="" />
        <h1><a href="/index.html">NuroHive</a></h1>
      </div>

      <div id="menu-flex-container">
        <div class="lang-switch">
          <a
            id="lang-toggle"
            href="/index-en.html"
            onclick="localStorage.setItem('user_lang', 'en')"
            >EN</a
          >
        </div>
        <!-- 800px以下で表示されるハンバーガーボタン -->
        <button
          id="hamburger-toggle"
          type="button"
          aria-label="ナビゲーションの開閉"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="menu-container">
          <a href="#hero-section">Top</a>
          <a href="#works-section">Works</a>
          <a href="#articles-section">Articles</a>
          <a href="#contact-section">Contact</a>
        </div>
      </div>
    </header>
    <button id="theme-toggle"></button>
    <main>
      <section id="hero-section">
        <div class="slideshow-container">
          <!-- スライド本体 -->
          <div class="slideshow-track">
            <div class="slide active">
              <img src="/images/quaira-hero.png" alt="Quaira Hero Image 1" />
            </div>
            <div class="slide">
              <img src="/images/gannet-hero.png" alt="Quaira Hero Image 2" />
            </div>
          </div>

          <!-- インジケーター（ドット） -->
          <div class="slideshow-dots">
            <button
              type="button"
              class="dot active"
              aria-label="スライド1を表示"
            ></button>
            <button
              type="button"
              class="dot"
              aria-label="スライド2を表示"
            ></button>
          </div>
        </div>
      </section>
      <section class="index-text-link" id="works-section">
        <h2>Works</h2>
        <p>
          <a href="/works/gannet.html">Gannet / Icing WatterBottle / 2017</a>
        </p>
      </section>

      <img
        src="/images/main-logo.png"
        alt=""
        style="width: 20px; margin: auto"
      />

      <section class="index-text-link" id="articles-section">
        <h2>Articles</h2>
        <p>
          <a href="/articles/Prefix-rule-article.html">
            NuroHiveのGit Issue接頭辞ルール
            <span class="article-meta">/ Git / 2026</span>
          </a>
        </p>
      </section>
      <p class="title-call">
        <span class="title-call-track">
          <span aria-hidden="true">NuroHive</span>
          <span aria-hidden="true">NuroHive</span>
          <span aria-hidden="true">NuroHive</span>
          <span aria-hidden="true">NuroHive</span>
        </span>
      </p>
    </main>
    <footer>
      <form
        class="contact-form"
        id="contact-section"
        action="https://formspree.io/f/myekwolr"
        method="POST"
      >
        <h2 class="notranslate">Contact</h2>

        <div class="form-group">
          <label for="name">Name</label>

          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>

          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="message">Message</label>

          <textarea id="message" name="message" rows="4" required></textarea>
        </div>

        <button type="submit">Send</button>
      </form>

      <!-- 外枠：画面横幅100%で上ボーダーを引く -->
      <div id="footer-inline-copyright">
        <div class="copyright-inner">
          <!-- 制作者（個人）のクレジット -->
          <p>Built by Auroraund</p>

          <!-- 公式アカウント（NuroHive）と開発者リンク -->
          <div class="footer-links">
            <a href="https://x.com/nurohive" target="_blank" rel="noopener"
              >X (@NuroHive)</a
            >
            <a
              href="https://github.com/auroraund"
              target="_blank"
              rel="noopener"
              >GitHub</a
            >
          </div>

          <p>© 2026 NuroHive</p>
        </div>
      </div>
    </footer>
    <script src="/js/scrolling-header.js"></script>
    <script src="/js/theme-switcher.js"></script>
    <script src="/js/slideshow.js"></script>
    <script src="/js/loading.js"></script>
    <script src="/js/header-responsive.js"></script>
  </body>
</html>
